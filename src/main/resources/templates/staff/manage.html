<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff ブース管理</title>
    <link rel="stylesheet" th:href="@{/css/staff-manage.css}">
</head>
<body>

    <header>
        <h1>Staff Dashboard</h1>
        <span>STAFF</span>
    </header>

    <main>
        <!-- 担当ブース情報 -->
        <section class="booth-header">
            <h2 class="event-name" th:text="${event.eventName}">イベント名</h2>
            <h1 th:text="${booth.boothName}">担当ブース名</h1>
            <div class="staff-count">
                <span>所属スタッフ数</span>
                <strong th:text="${staffCount}">0</strong>
                <span>人</span>
            </div>
            <p class="booth-description" th:text="${booth.description}">ブースの説明</p>
            <p class="booth-location" th:text="${booth.location}">場所</p>

        </section>

        <!-- 管理メニュー -->
        <section class="menu-section">
            <h2>ブース管理メニュー</h2>

            <div class="menu-grid">

                <div class="menu-card">
                    <h3>商品・在庫管理</h3>
                    <p>商品の登録や在庫数を管理します。</p>
                    <a href="#">
                        管理する
                        <span>→</span>
                    </a>
                </div>

                <div class="menu-card">
                    <h3>注文管理</h3>
                    <p>担当ブースへの注文を確認します。</p>
                    <a href="#">
                        確認する
                        <span>→</span>
                    </a>
                </div>

                <div class="menu-card">
                    <h3>売上・会計管理</h3>
                    <p>担当ブースの売上や会計状況を確認します。</p>
                    <a href="#">
                        確認する
                        <span>→</span>
                    </a>
                </div>

                <div class="menu-card">
                    <h3>出金・経費管理</h3>
                    <p>ブースの経費や出金を管理します。</p>
                    <a href="#">
                        管理する
                        <span>→</span>
                    </a>
                </div>

                <div class="menu-card">
                    <h3>メンバー確認</h3>
                    <p>担当ブースのStaffメンバーを確認します。</p>
                    <a href="#">
                        確認する
                        <span>→</span>
                    </a>
                </div>

            </div>
        </section>

        <!-- 戻る -->
        <a class="back-link" th:href="@{/staff/eventMG}">
            ← 担当ブース選択に戻る
        </a>

    </main>

</body>
</html>
