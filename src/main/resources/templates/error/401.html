
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 - ページが見つかりません</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 16px;
        }

        h1 {
            font-size: 80px;
            color: #e57373;
            margin: 0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="error-container">
    <h1>HTTP error :(  401</h1>
    <h2>No Acount</h2>
    <p>このページを閲覧するには認証（ログインまたは新規登録）が必要です。</p>

    <a th:href="@{/login}">ログイン・新規登録</a>
</div>

</body>
</html>
