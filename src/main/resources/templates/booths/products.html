
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 | Event Manager</title>
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>

<body>

<header class="header">
    <div class="header-inner">
        <a th:href="@{/staff/booths/{boothId}/manage(boothId=${boothId})}"  class="logo">店舗商品管理</a>
        <span class="header-label">商品管理</span>
    </div>
</header>

<main class="container">

    <div class="page-heading">
        <p class="eyebrow">店舗商品管理MANAGEMENT</p>
        <h1>商品管理</h1>
        <p class="page-description">
            商品の登録・商品在庫確認等を行えるMANAGEMENTです。
        </p>
    </div>

    <!-- 商品登録 -->
    <section class="panel">

        <div class="section-heading">
            <div>
                <h2>商品を登録する</h2>
                <p>新しい商品情報を入力してください。</p>
            </div>
        </div>

        <form th:action="@{/booths/{boothId}/products/create(boothId=${boothId})}"
              method="post"
              th:object="${productForm}"
              class="product-form">

            <div class="form-group">
                <label for="productName">商品名</label>
                <input type="text"
                       id="productName"
                       th:field="*{productName}"
                       maxlength="150"
                       placeholder="例：焼きそば"
                       required>
            </div>

            <div class="form-group">
                <label for="description">商品説明</label>
                <textarea id="description"
                          th:field="*{description}"
                          rows="3"
                          placeholder="商品の説明を入力してください"></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="price">価格（円）</label>
                    <input type="number"
                           id="price"
                           th:field="*{price}"
                           min="0"
                           placeholder="500"
                           required>
                </div>

                <div class="form-group">
                    <label for="stockQuantity">在庫数</label>
                    <input type="number"
                           id="stockQuantity"
                           th:field="*{stockQuantity}"
                           min="0"
                           placeholder="30">
                    <small>未入力の場合は在庫数を設定しません。</small>
                </div>

            </div>

            <button type="submit" class="submit-button">
                商品を登録する
            </button>

        </form>

    </section>

    <!-- 商品一覧 -->
    <section class="panel">

        <div class="section-heading">
            <div>
                <h2>登録済みの商品</h2>
                <p>現在登録されている商品です。</p>
            </div>
            <span class="product-count"
                  th:text="${#lists.size(products)} + ' 件'">0 件</span>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="empty-message">
            <p>まだ商品が登録されていません。</p>
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="product-list">

            <article class="product-item" th:each="product : ${products}">

                <div class="product-info">
                    <h3 th:text="${product.productName}">商品名</h3>
                    <p class="product-description"
                       th:text="${product.description ?: '説明はありません'}">
                        商品説明
                    </p>
                </div>

                <div class="product-details">
                    <span class="product-price"
                          th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')} + '円'">
                        500円
                    </span>

                    <span class="product-stocks"
                          th:text="${product.stockQuantity == null ? '在庫数未設定' : '在庫：' + product.stockQuantity}">
                        在庫：30
                    </span>
                </div>

                <!-- 編集・削除 -->
                <div class="product-actions">

                    <a th:href="@{/booths/{boothId}/products/{productId}/edit(boothId=${boothId}, productId=${product.id})}"
                       class="product-action edit-button">
                        編集
                    </a>

                    <form th:action="@{/booths/{boothId}/products/{productId}/delete(boothId=${boothId}, productId=${product.id})}"
                          method="post"
                          onsubmit="return confirm('この商品を削除しますか？');">

                        <button type="submit"
                                class="product-action delete-button">
                            削除
                        </button>

                    </form>

                </div>

            </article>

        </div>

    </section>

    <div class="back-area">
        <a href="javascript:history.back()" class="back-link">
            前のページに戻る
        </a>
    </div>

</main>

</body>
</html>
