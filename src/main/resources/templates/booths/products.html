
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 | Event Manager</title>

    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">Event Manager</a>
            <span class="header-label">商品管理</span>
        </div>
    </header>

    <main class="container">

        <div class="page-heading">
            <div>
                <p class="eyebrow">PRODUCT MANAGEMENT</p>
                <h1>商品管理</h1>
                <p class="page-description">
                    ブースで販売する商品の登録・確認ができます。
                </p>
            </div>
        </div>

        <!-- 商品登録フォーム -->
        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>新しい商品を登録</h2>
                    <p>商品の情報を入力してください。</p>
                </div>
            </div>

            <form th:action="@{/booths/{boothId}/products/create(boothId=${boothId})}"
                  method="post"
                  th:object="${productForm}"
                  class="product-form">

                <div class="form-group">
                    <label for="productName">商品名 <span class="required">必須</span></label>
                    <input type="text"
                           id="productName"
                           th:field="*{productName}"
                           placeholder="例：焼きそば"
                           maxlength="150"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">商品説明</label>
                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="商品の説明を入力してください。"
                              rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">価格（円） <span class="required">必須</span></label>
                        <input type="number"
                               id="price"
                               th:field="*{price}"
                               placeholder="500"
                               min="0"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="stockQuantity">在庫数</label>
                        <input type="number"
                               id="stockQuantity"
                               th:field="*{stockQuantity}"
                               placeholder="例：30"
                               min="0">
                        <small>未入力の場合は在庫数を設定しません。</small>
                    </div>
                </div>

                <button type="submit" class="submit-button">
                    商品を登録する
                </button>

            </form>
        </section>

        <!-- 商品一覧 -->
        <section class="panel product-list-panel">
            <div class="section-heading">
                <div>
                    <h2>登録済み商品</h2>
                    <p>このブースに登録されている商品です。</p>
                </div>
                <span class="product-count"
                      th:text="${#lists.size(products)} + ' 件'">
                    0 件
                </span>
            </div>

            <div th:if="${#lists.isEmpty(products)}" class="empty-message">
                <p>まだ商品が登録されていません。</p>
            </div>

            <div th:unless="${#lists.isEmpty(products)}" class="product-list">

                <article class="product-item"
                         th:each="product : ${products}">

                    <div class="product-info">
                        <h3 th:text="${product.productName}">商品名</h3>
                        <p class="product-description"
                           th:text="${product.description ?: '説明はありません'}">
                            商品説明
                        </p>
                    </div>

                    <div class="product-details">
                        <span class="product-price"
                              th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')} + '円'">
                            500円
                        </span>

                        <span class="product-stock"
                              th:text="${product.stockQuantity == null ? '在庫数未設定' : '在庫：' + product.stockQuantity}">
                            在庫：30
                        </span>
                    </div>

                </article>

            </div>
        </section>

        <div class="back-area">
            <a href="javascript:history.back()" class="back-link">戻る</a>
        </div>

    </main>

</body>
</html>
